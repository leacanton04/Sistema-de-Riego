<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Riego Compacto</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.6.1/justgage.min.js"></script>
</head>
<body>

    <div class="dashboard-container">

        <button id="btn-regar" class="btn-regar">💦 Regar Manualmente</button>
        
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Modo</span>
                <span id="valor-modo" class="badge">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">Bomba</span>
                <span id="valor-bomba" class="badge">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">Planta</span>
                <span id="valor-estado" class="badge">--</span>
            </div>
        </div>

        <div class="gauges-grid">
            
            <div class="gauge-card">
                <div id="gauge-temp" class="gauge-display"></div>
                <h3 class="gauge-label">Temp. Amb.</h3>
            </div>

            <div class="gauge-card">
                <div id="gauge-hum-amb" class="gauge-display"></div>
                <h3 class="gauge-label">Hum. Amb.</h3>
            </div>

            <div class="gauge-card target-card">
                <div id="gauge-hum-suel" class="gauge-display"></div>
                <h3 class="gauge-label">Hum. Suelo</h3>
                <div class="ideal-container">Ideal: <span id="valor-ideal">--</span>%</div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Configuración común optimizada para tamaños pequeños
            const commonConfig = {
                min: 0,
                gaugeWidthScale: 0.6,
                pointer: false,
                valueFontColor: "#2d3748",
                valueFontFamily: "system-ui, -apple-system, sans-serif",
                hideMinMax: true // Ocultamos el 0 y 100 de las esquinas para ganar espacio vertical
            };

            // Gráfico de Temperatura (Tonos rojizos fijos)
            var gaugeTemp = new JustGage({
                id: "gauge-temp", value: 0, max: 50,
                levelColors: ["#ffb3b3", "#ff4d4d", "#cc0000"], ...commonConfig
            });

            // Gráfico de Humedad Ambiente (Tonos azulados fijos)
            var gaugeHumAmb = new JustGage({
                id: "gauge-hum-amb", value: 0, max: 100,
                levelColors: ["#b3d9ff", "#3399ff", "#005ce6"], ...commonConfig
            });

            // Gráfico de Humedad Suelo (Tonos verdes fijos)
            var gaugeHumSuel = new JustGage({
                id: "gauge-hum-suel", value: 0, max: 100,
                levelColors: ["#b3ffb3", "#33cc33", "#008000"], ...commonConfig
            });

            const btnRegar = document.getElementById("btn-regar");
            btnRegar.addEventListener("click", () => {
                btnRegar.textContent = "⏳ Enviando...";
                fetch('/toggle-bomba').catch(err => console.error(err));
            });

            // Actualización en tiempo real cada 2 segundos
            setInterval(() => {
                fetch('/datos')
                    .then(res => res.json())
                    .then(datos => {
                        // Refrescar valores numéricos de los medidores
                        gaugeTemp.refresh(datos.temperatura);
                        gaugeHumAmb.refresh(datos.humedad_amb);
                        gaugeHumSuel.refresh(datos.humedad_suelo);

                        // Elementos del DOM
                        const badgeModo = document.getElementById("valor-modo");
                        const badgeBomba = document.getElementById("valor-bomba");
                        const badgeEstado = document.getElementById("valor-estado");
                        const textIdeal = document.getElementById("valor-ideal");

                        // Asignar los valores del JSON
                        badgeModo.textContent = datos.modo;
                        badgeBomba.textContent = datos.bomba;
                        badgeEstado.textContent = datos.estado;
                        textIdeal.textContent = datos.ideal;

                        // Colores dinámicos para las pastillas superiores
                        badgeModo.style.backgroundColor = (datos.modo === "AUTOMATICO") ? "#805ad5" : "#4a5568";
                        badgeBomba.style.backgroundColor = (datos.bomba === "ENCENDIDA") ? "#38a169" : "#e53e3e";
                        
                        // Color de la pastilla de estado de planta
                        if (datos.estado === "Optima") badgeEstado.style.backgroundColor = "#38a169";
                        else if (datos.estado === "Humeda" || datos.estado === "Seca") badgeEstado.style.backgroundColor = "#dd6b20";
                        else badgeEstado.style.backgroundColor = "#e53e3e";

                        // Estilo del botón principal
                        if (datos.bomba === "ENCENDIDA") {
                            btnRegar.textContent = "🛑 Regando... (Parar)";
                            btnRegar.classList.add("btn-activo");
                        } else {
                            btnRegar.textContent = "💦 Regar Manualmente";
                            btnRegar.classList.remove("btn-activo");
                        }
                    })
                    .catch(error => console.error("Error leyendo datos:", error));
            }, 2000);
        });
    </script>
</body>
</html>
